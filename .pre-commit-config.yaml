minimum_prek_version: "0.4.14"
default_install_hook_types: [pre-commit, commit-msg, pre-push]
default_stages: [pre-commit]
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
        exclude: &format_exclude '(^|/)(fixtures|testdata|data|build|dist|local|\.tools|__pycache__)/|^docs/(reports|validation)/|^tests/scenarios/|(_fixture|_test_values|/generated_[^/]+|/player_engine_sites|/grind_recipe_profile|/grind_item_(shape|constructor))\.hpp$|^docs/.*-world-evidence\.json$'
      - id: end-of-file-fixer
        exclude: *format_exclude
      - id: check-merge-conflict
        args: [--assume-in-merge]
      - id: check-added-large-files
        args: [--enforce-all]
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.5
    hooks:
      - id: ruff-format
        types_or: [python, pyi]
        exclude: *format_exclude
      - id: ruff-check
  - repo: https://github.com/scop/pre-commit-shfmt
    rev: v3.13.1-1
    hooks:
      - id: shfmt
        args: [-w, -i, '2', -ci]
        exclude: *format_exclude
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      - id: shellcheck
  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: v0.21.0
    hooks:
      - id: markdownlint-cli2
        exclude: ^docs/reports/
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
  - repo: https://github.com/pre-commit/mirrors-clang-format
    rev: v23.1.5
    hooks:
      - id: clang-format
        types_or: [c, c++]
        exclude: *format_exclude
  - repo: https://github.com/BlankSpruce/gersemi-pre-commit
    rev: 0.29.2
    hooks:
      - id: gersemi
        types: [cmake]
        exclude: *format_exclude
  - repo: https://github.com/python-jsonschema/check-jsonschema
    rev: 0.37.0
    hooks:
      - id: check-github-workflows
  - repo: local
    hooks:
      - id: actionlint
        name: Lint GitHub Actions workflows
        language: system
        entry: mise x actionlint@1.7.12 -- actionlint
        files: ^\.github/workflows/[^/]+\.ya?ml$
      - id: renovate-config
        name: Validate Renovate configuration
        language: system
        entry: mise x -- npm exec --yes --ignore-scripts --package=renovate@44.232.0 -- renovate-config-validator --strict --no-global
        files: ^renovate\.json$
      - id: bilingual-docs
        name: Check bilingual documentation
        language: system
        entry: python3 -B -m unittest discover -s tests/python/package -p test_user_docs.py
        pass_filenames: false
        always_run: true
      - id: export-leaks
        name: Scan tracked files and all Git objects
        language: system
        entry: python3 -B tools/lint/leak-scan.py
        stages: [manual, pre-push]
        pass_filenames: false
        always_run: true
      - id: clang-tidy
        name: Report clang-tidy findings against the baseline
        language: system
        entry: python3 tools/lint/report-clang-tidy.py
        stages: [manual]
        pass_filenames: false
        always_run: true
        verbose: true
      - id: conventional-commit
        name: Check Conventional Commit subject
        language: system
        entry: python3 tools/lint/commit-subject.py
        stages: [commit-msg]
