name: PR title
on:
  # A title edit runs only this check. The code checks in ci.yml keep their
  # result, so an edit cannot turn a failed pull request green.
  pull_request:
    types: [opened, edited, reopened, synchronize]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  title:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      # The validator comes from the base branch, so a pull request cannot
      # loosen the rules for its own title.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.base.sha }}
          sparse-checkout: tools/lint/commit-subject.py
          sparse-checkout-cone-mode: false
      - name: Check the Conventional Commit title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: python3 -B tools/lint/commit-subject.py --title "$PR_TITLE"
