name: Draft player release
on:
  push:
    tags: ['v*']
permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/ci.yml
  draft:
    needs: build
    concurrency: draft-${{ github.ref }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: windows-x86
      - name: Create draft and attach the matching player ZIP
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        with:
          script: |
            const fs = require('node:fs')
            const tag = context.ref.slice('refs/tags/'.length)
            const packages = fs.readdirSync('dist').filter(f => /^union-batch-crafting-player-.*\.zip$/.test(f))
            if (packages.length !== 1) throw Error('Expected one player ZIP')
            const [name] = packages
            const data = fs.readFileSync('dist/' + name)
            const api = github.rest.repos
            const releases = await github.paginate(api.listReleases, {...context.repo, per_page: 100})
            let draft = releases.find(r => r.tag_name === tag)
            if (draft && !draft.draft) throw Error('Tag already has a published release')
            if (!draft) {
              const response = await api.createRelease({...context.repo, tag_name: tag, name: tag, draft: true})
              draft = response.data
            }
            const asset = draft.assets.find(a => a.name === name)
            if (asset) {
              const digest = require('node:crypto').createHash('sha256').update(data).digest('hex')
              if (asset.digest !== 'sha256:' + digest) throw Error('Existing draft asset differs')
            } else {
              await api.uploadReleaseAsset({...context.repo, release_id: draft.id, name, data})
            }
