name: CI
on:
  # Only main: Renovate branches are checked once through their pull request.
  # A branch filter alone also excludes tag pushes; release.yml handles v* tags.
  push:
    branches: [main]
  pull_request:
    types: [opened, reopened, synchronize, edited]
  workflow_call:
permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ matrix.check == 'sanitizers' && 60 || 40 }}
    strategy:
      fail-fast: false
      matrix:
        check: [lint, portable, sanitizers, windows, history]
    env:
      # A title edit only needs the history check with the new title.
      RUN: ${{ github.event.action != 'edited' || matrix.check == 'history' }}
    steps:
      - if: env.RUN == 'true'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          fetch-depth: ${{ matrix.check == 'history' && '0' || '1' }}
          ref: ${{ matrix.check == 'history' && github.event.pull_request.head.sha || github.sha }}
      - name: Cache Windows SDK
        if: env.RUN == 'true' && matrix.check == 'windows'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .cache/ci-sdk.tar.gz
          key: xwin-x86-v1-${{ hashFiles('tools/build/windows-sdk-manifest.json', 'tools/build/setup-toolchain-WRITES.py') }}
      - name: Run pinned build environment
        if: env.RUN == 'true'
        env:
          CHECK: ${{ matrix.check }}
          EVENT: ${{ github.event_name }}
          EVENT_REF: ${{ github.ref }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE:/src" -w /src -e CHECK -e EVENT -e EVENT_REF -e BASE -e HEAD_SHA -e PR_TITLE \
            -e CMAKE_BUILD_PARALLEL_LEVEL=2 \
            archlinux:base-20261108.0.623074@sha256:fcee73ea1b96e236248f53a213f71276cc9072d9025b58bce9915e32f19963ae \
            bash -euc '
              bash tools/ci/bootstrap.sh "$CHECK"
              case "$CHECK" in
                lint) mise run lint:all ;;
                portable) mise run test:report-WRITES -- --apply --timeout-seconds 1200 ;;
                sanitizers) mise run test:sanitizers ;;
                history)
                  python3 -B tools/lint/leak-scan.py
                  if [[ "$EVENT" == pull_request ]]; then
                    bash tools/ci/check-commits.sh "$BASE" "$HEAD_SHA" "$PR_TITLE"
                  elif [[ "$EVENT" == push && "$EVENT_REF" == refs/heads/main ]]; then
                    bash tools/ci/check-commits.sh "$BASE" "$HEAD_SHA"
                  fi
                  ;;
                windows) bash tools/ci/windows.sh ;;
              esac'
      - name: Save player package and hash report
        if: env.RUN == 'true' && matrix.check == 'windows'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-x86
          path: |
            dist/*-player-*.zip
            reports/windows-hashes.txt
          if-no-files-found: error
          retention-days: 3
