name: CI
on:
  # Only main: Renovate branches are checked once through their pull request.
  # The release job below creates the tags.
  push:
    branches: [main]
  # Title edits do not change the code. pr-title.yml checks the title alone, so
  # the results of these checks stay with the commit they tested.
  pull_request:
    types: [opened, reopened, synchronize]
permissions:
  contents: read
# A new push cancels the older run of the same pull request. Every other run
# gets its own group: a shared group would drop a waiting run on main when a
# third commit arrives, and that commit would never get a result.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    runs-on: ubuntu-26.04
    timeout-minutes: ${{ matrix.check == 'sanitizers' && 60 || 40 }}
    strategy:
      fail-fast: false
      matrix:
        check: [lint, portable, sanitizers, windows, history]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: ${{ matrix.check == 'history' && '0' || '1' }}
          ref: ${{ matrix.check == 'history' && github.event.pull_request.head.sha || github.sha }}
      - name: Cache Windows SDK
        if: matrix.check == 'windows'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/ci-sdk.tar.gz
          key: xwin-x86-v1-${{ hashFiles('tools/build/windows-sdk-manifest.json', 'tools/build/setup-toolchain-WRITES.py') }}
      # The key covers the snapshot date and package lists in bootstrap.sh. A
      # restored cache keeps a job independent of the snapshot hosts.
      - name: Cache Arch packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/pacman
          key: pacman-${{ matrix.check }}-${{ hashFiles('tools/ci/bootstrap.sh') }}
      - name: Run pinned build environment
        env:
          CHECK: ${{ matrix.check }}
          EVENT: ${{ github.event_name }}
          EVENT_REF: ${{ github.ref }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE:/src" -w /src -e CHECK -e EVENT -e EVENT_REF -e BASE -e HEAD_SHA \
            -e CMAKE_BUILD_PARALLEL_LEVEL=2 \
            archlinux:base-20261108.0.623074@sha256:fcee73ea1b96e236248f53a213f71276cc9072d9025b58bce9915e32f19963ae \
            bash -euc '
              bash tools/ci/bootstrap.sh "$CHECK"
              case "$CHECK" in
                lint) mise run lint:all ;;
                portable) mise run test:report-WRITES -- --apply --timeout-seconds 1200 ;;
                sanitizers) mise run test:sanitizers ;;
                history)
                  python3 -B tools/lint/leak-scan.py
                  if [[ "$EVENT" == pull_request || ( "$EVENT" == push && "$EVENT_REF" == refs/heads/main ) ]]; then
                    bash tools/ci/check-commits.sh "$BASE" "$HEAD_SHA"
                  fi
                  # A version pull request must ship the player DLL tested in game.
                  if [[ "$EVENT" == pull_request ]] && ! git diff --quiet "$BASE" "$HEAD_SHA" -- VERSION; then
                    python3 -B tools/release/release.py check --evidence
                  fi
                  ;;
                windows) bash tools/ci/windows.sh ;;
              esac'
      - name: Save player package and hash report
        if: matrix.check == 'windows'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-x86
          path: |
            dist/*-player-*.zip
            reports/windows-hashes.txt
          if-no-files-found: error
          retention-days: 3

  # A merge that changes VERSION publishes that version: tag, player ZIP and
  # notes with the changelog and SHA-256 values. Every other push to main finds
  # the release of the current version and stops.
  release:
    needs: checks
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: ${{ github.workflow }}-release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: windows-x86
      - name: Publish the release of VERSION
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release=$(cat VERSION)
          if gh release view "v$release" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "v$release is already released"
            exit 0
          fi
          archive="dist/union-batch-crafting-player-$release.zip"
          python3 -B tools/release/release.py notes "$archive" --repository "$GITHUB_REPOSITORY" >notes.md
          gh release create "v$release" "$archive" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Union Batch Crafting $release" --notes-file notes.md --latest
